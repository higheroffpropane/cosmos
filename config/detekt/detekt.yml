build:
  maxIssues: 0

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  # Navigation files hold a route type plus NavGraphBuilder extensions; Contract files
  # hold a feature's sealed state/intent/effect types regardless of how many exist yet.
  MatchingDeclarationName:
    excludes: ['**/*Navigation.kt', '**/*Contract.kt']

# The shared-transition bridge locals are a deliberate architectural seam
# (app provides scopes, features consume them without compile-time coupling).
Compose:
  CompositionLocalAllowlist:
    allowedCompositionLocals:
      - LocalSharedTransitionScope
      - LocalNavAnimatedVisibilityScope

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'PreviewThemes']
